# Known games: executable names -> name and genre.
# Executable names were collected from public sources and still need checking on real installs
# (see README "Game database"). A wrong name only means the game falls back to library/fullscreen
# detection; it never changes what a tweak does.

[[genre]]
id = "shooter"
tips = [
  "Turn on NVIDIA Reflex or AMD Anti-Lag in the game's graphics settings.",
  "Cap FPS a little below what your GPU can hold so it never sits at 100%: lower latency, steadier frames.",
]

[[genre]]
id = "moba"
tips = [
  "Cap FPS at a multiple of your monitor's refresh rate for even frame pacing.",
]

[[genre]]
id = "strategy"
tips = [
  "Late-game turns are CPU-bound: close browser tabs before long sessions.",
]

[[genre]]
id = "open_world"
tips = [
  "The first run after a driver update stutters while shaders compile. Play 10 minutes before judging.",
  "Upscaling (DLSS, FSR, XeSS) on Quality usually gains more FPS than any system tweak.",
]

[[genre]]
id = "racing"
tips = [
  "Steady frame times matter more than peak FPS: cap FPS at your refresh rate.",
]

[[genre]]
id = "sandbox"
tips = [
  "Render distance is the biggest FPS lever in sandbox games.",
]

[[genre]]
id = "mmo"
tips = [
  "Crowded cities are CPU-bound: lower 'max visible players' before graphics quality.",
]

[[genre]]
id = "casual"
tips = [
  "On laptops, cap FPS to your refresh rate to keep fans quiet and battery longer.",
]

